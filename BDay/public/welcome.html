<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎉 You're Invited!</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(ellipse at bottom, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      position: relative;
    }
    .balloon {
      position: absolute;
      font-size: 2rem;
      opacity: 0.85;
      animation: rise 12s linear infinite;
      pointer-events: none;
    }
    .balloon:nth-child(1) { left: 10%; animation-duration: 14s; animation-delay: -2s; }
    .balloon:nth-child(2) { left: 25%; animation-duration: 16s; animation-delay: -4s; }
    .balloon:nth-child(3) { left: 45%; animation-duration: 13s; animation-delay: -1s; }
    .balloon:nth-child(4) { left: 65%; animation-duration: 15s; animation-delay: -5s; }
    .balloon:nth-child(5) { left: 82%; animation-duration: 12s; animation-delay: -3s; }
    .balloon:nth-child(6) { left: 92%; animation-duration: 17s; animation-delay: -6s; }
    @keyframes rise {
      0%   { transform: translateY(0) rotate(-5deg); opacity: 0; }
      10%  { opacity: 0.85; }
      100% { transform: translateY(-110vh) rotate(15deg); opacity: 0; }
    }
    .welcome-container {
      text-align: center;
      color: #fff;
      animation: fadeIn 1.5s ease-in;
      z-index: 2;
    }
    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 4rem;
      margin: 0;
      background: linear-gradient(45deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #ff6b6b);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 5s ease infinite, textGlow 2s ease-in-out infinite alternate;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes textGlow {
      from { text-shadow: 0 0 10px rgba(255,107,107,0.4), 0 0 20px rgba(0,0,0,0.2); }
      to { text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ffd93d, 0 0 60px #6bcb77; }
    }
    .balloons-sub {
      font-size: 2.5rem;
      margin: 1.5rem 0;
      animation: float 2s ease-in-out infinite alternate;
    }
    @keyframes float { from { transform: translateY(0); } to { transform: translateY(-12px); } }
    .welcome-sub { font-size: 1.2rem; opacity: 0.92; }
    .enter-btn {
      margin-top: 2.5rem;
      padding: 16px 48px;
      background: linear-gradient(45deg, #ff6b6b, #ffd93d, #6bcb77);
      background-size: 300% 300%;
      border: none;
      color: #1a1a2e;
      font-size: 1.3rem;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 25px rgba(255, 107, 107, 0.5);
      animation: pulseGlow 2s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      from { box-shadow: 0 0 20px rgba(255,107,107,0.4); }
      to { box-shadow: 0 0 40px #ff6b6b, 0 0 60px #ffd93d; }
    }
    .enter-btn:hover { transform: scale(1.08) rotate(-2deg); color: #fff; box-shadow: 0 0 45px #fff; }
    .enter-btn:active { transform: scale(1.03); }
    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 1rem;
      color: #fff;
      opacity: 0.95;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .about-icon {
      cursor: pointer;
      font-size: 1.1rem;
      color: #fff;
      background-color: rgba(255, 217, 61, 0.85);
      border-radius: 50%;
      padding: 4px 10px;
      font-weight: bold;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.25);
      transition: all 0.3s ease;
    }
    .about-icon:hover { color: #1a1a2e; transform: scale(1.15); }
    .modal {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      padding: 20px 28px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 8px 32px rgba(31,38,135,0.4);
      display: none;
      animation: fadeIn 0.4s ease;
      backdrop-filter: blur(10px);
    }
    .modal.show { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, 20px) scale(0.9); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
  </style>
</head>
<body>
<div class="balloon">🎈</div>
  <div class="balloon">🎂</div>
  <div class="balloon">🎉</div>
  <div class="balloon">🎁</div>
  <div class="balloon">🎈</div>
  <div class="balloon">🎂</div>

  <div class="welcome-container">
    <h1>You're Invited!</h1>
    <div class="balloons-sub">🎈 🎂 🎉 🎁 🎈</div>
    <p class="welcome-sub">Make a wish &amp; pick your dream gift 🎁</p>
    <button class="enter-btn" onclick="enterSite()">✨ Tap to Enter the Party</button>
  </div>

  <div class="footer">
    Made with ❤️ by S.Maheswar
    <span class="about-icon" onclick="toggleAbout()">ℹ️</span>
  </div>

  <div id="aboutModal" class="modal">
    <strong>About the Creator:</strong><br />
    🎨 Mahesh is a passionate front-end developer <br />
    📍 Based in India<br />
    💻 Loves creating fun, interactive web experiences<br />
    🌐 New Ideas coming soon!
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const name = urlParams.get('name');

    function enterSite() {
      if (name) {
        window.location.href = `wish.html?name=${encodeURIComponent(name)}`;
      } else {
        window.location.href = "wish.html";
      }
    }

    function toggleAbout() {
      document.getElementById('aboutModal').classList.toggle('show');
    }

    confetti({
      particleCount: 60,
      spread: 100,
      origin: { y: 0.6 }
    });

    window.addEventListener("click", (event) => {
      const modal = document.getElementById("aboutModal");
      const icon = document.querySelector(".about-icon");
      if (modal && icon && !modal.contains(event.target) && !icon.contains(event.target)) {
        modal.classList.remove("show");
      }
    });
  </script>
</body>
</html>
